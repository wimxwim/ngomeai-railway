<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>NgomeAI — Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8f9fb; }
    input { outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    input:focus { border-color: #16a34a !important; box-shadow: 0 0 0 3px rgba(22,163,74,0.1); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm px-4">
    <div class="text-center mb-8">
      <div class="text-4xl mb-3">🤖</div>
      <h1 class="text-2xl font-bold text-gray-900">NgomeAI</h1>
      <p class="text-gray-400 text-sm mt-1">Admin Panel</p>
    </div>

    <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
      <h2 class="text-gray-900 font-semibold text-lg mb-6">Masuk ke Dashboard</h2>

      <div id="error" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 mb-4"></div>

      <div class="space-y-4">
        <div>
          <label class="text-gray-600 text-sm font-medium block mb-1.5">Username</label>
          <input id="username" type="text" autocomplete="username"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-300 text-sm"
            placeholder="admin">
        </div>
        <div>
          <label class="text-gray-600 text-sm font-medium block mb-1.5">Password</label>
          <input id="password" type="password" autocomplete="current-password"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-300 text-sm"
            placeholder="••••••••">
        </div>
        <button type="button" id="submitBtn"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2 text-sm">
          <span id="btnText">Masuk</span>
          <svg id="spinner" class="hidden animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
        </button>
      </div>
    </div>

    <p class="text-center text-gray-400 text-xs mt-6">NgomeAI Admin v2.5</p>
  </div>

  <script src="/admin/js/login.js"></script>
</body>
</html>
