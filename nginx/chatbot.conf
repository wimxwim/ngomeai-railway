# ═══════════════════════════════════════════════════════════════════
#  Nginx config — WhatsApp Chatbot (personal / single server)
#  Free: nginx + certbot (Let's Encrypt)
#
#  Install:
#    sudo apt install nginx certbot python3-certbot-nginx -y
#    sudo cp nginx/chatbot.conf /etc/nginx/sites-available/chatbot
#    sudo ln -s /etc/nginx/sites-available/chatbot /etc/nginx/sites-enabled/
#    sudo certbot --nginx -d yourdomain.com
#    sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════

# Rate limit zona: max 20 req/menit per IP untuk /webhook
# (Meta kirim webhook 1-2x per pesan, 20/mnt lebih dari cukup)
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=20r/m;

# Rate limit zona longgar untuk /health (monitoring tools)
limit_req_zone $binary_remote_addr zone=health_limit:1m rate=60r/m;

# ─── Redirect HTTP → HTTPS ─────────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com;                    # ← GANTI domain kamu

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS server utama ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name yourdomain.com;                    # ← GANTI domain kamu

    # SSL (certbot akan isi otomatis setelah certbot --nginx)
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Security headers (free, langsung aktif) ─────────────────
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "no-referrer"     always;
    add_header Permissions-Policy        "geolocation=()"  always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;

    # Sembunyikan versi nginx dari response header
    more_clear_headers Server;

    # Max body size — cukup untuk payload webhook Meta (~50KB)
    client_max_body_size 512k;

    # ─── /webhook POST (Meta WhatsApp) ───────────────────────────
    location /webhook {

        # Rate limit: burst 10, tanpa antrian (nodelay)
        limit_req zone=webhook_limit burst=10 nodelay;
        limit_req_status 429;

        # ── IP Allowlist Meta/Facebook ────────────────────────────
        # Meta mempublikasikan ASN AS32934. Range di bawah per Mei 2026.
        # Catatan: signature verification di app sudah jadi primary defense.
        # IP list ini adalah defense-in-depth (layer kedua, gratis).
        # Update range jika Meta mengumumkan perubahan IP.
        #
        # Untuk aktifkan: hapus tanda # di bawah ini.
        #
        # allow 31.13.24.0/21;
        # allow 31.13.64.0/18;
        # allow 45.64.40.0/22;
        # allow 66.220.144.0/20;
        # allow 66.220.152.0/21;
        # allow 69.63.176.0/20;
        # allow 69.171.224.0/19;
        # allow 74.119.76.0/22;
        # allow 103.4.96.0/22;
        # allow 157.240.0.0/17;
        # allow 173.252.64.0/18;
        # allow 204.15.20.0/22;
        # deny all;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;

        # Timeout pas buat webhook (Node balas 200 cepat, proses async)
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # ─── /health (untuk monitoring uptime) ───────────────────────
    location /health {
        limit_req zone=health_limit burst=5 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;

        # Cache health response 5 detik (kurangi load DB)
        proxy_cache_valid 200 5s;
    }

    # ─── Admin panel & API — localhost only ───────────────────────
    # SECURITY: Admin endpoints must never be exposed to the public internet.
    # Access is restricted to 127.0.0.1 (server itself / SSH tunnel).
    # To access from your machine: ssh -L 8080:localhost:443 user@yourserver
    # then open https://localhost:8080/admin/
    location /admin {
        allow 127.0.0.1;
        deny  all;

        # Tight rate limit: 10 req/min for admin UI
        limit_req zone=health_limit burst=5 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/admin {
        allow 127.0.0.1;
        deny  all;

        limit_req zone=health_limit burst=10 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Blokir semua path lain ───────────────────────────────────
    location / {
        return 404;
    }

    # ─── Log (default nginx, gratis) ─────────────────────────────
    access_log /var/log/nginx/chatbot-access.log combined;
    error_log  /var/log/nginx/chatbot-error.log warn;
}
